<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StarboundPlanner Google 3D Terrain</title>
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #2c2c2c; }
    #notice { position: absolute; top: 64px; left: 12px; color: white; background: #222d; padding: 8px; font: 13px sans-serif; }
    #controls { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; background: #252525ed; color: #e4e4e4; padding: 8px; font: 13px sans-serif; border-radius: 6px; }
    #controls label { display: flex; align-items: center; gap: 6px; }
    #controls input { width: 120px; accent-color: #1084fe; }
    #controls select { color: #e4e4e4; background: #383838; }
    #controls button { color: white; background: #1084fe; border: 1px solid #63aaff; border-radius: 3px; padding: 5px 9px; cursor: pointer; }
    #controls button:hover { background: #2b94ff; }
    #credits { position: absolute; bottom: 0; left: 0; right: 0; background: #252525df; color: white; padding: 5px 8px; font: 11px sans-serif; pointer-events: none; }
    #credits img { width: 100px; vertical-align: middle; margin-right: 8px; }
  </style>
</head>
<body>
  <div id="map"></div><div id="notice">Loading Google photorealistic terrain...</div>
  <div id="controls">
    <button id="native">Native 3D</button><button id="reset">Follow / reset</button>
    <span>Google Photorealistic 3D Tiles</span>
    <label>Drone size <select id="size"><option value="auto">Auto</option><option value="1">Real size</option><option value="10">10x</option><option value="25">25x</option><option value="50">50x</option><option value="100">100x</option></select></label>
    <label>Orbit <input id="orbit" type="range" min="-180" max="180" value="0"><output id="orbit-value">0°</output></label>
    <label>Zoom <input id="zoom" type="range" min="0" max="100" value="40"><output id="zoom-value"></output></label>
  </div>
  <div id="credits"><img src="https://maps.gstatic.com/mapfiles/api-3/images/google_white5.png" alt="Google"><span id="provider-credits"></span></div>
  <script src="viewer.bundle.js"></script>
</body>
</html>
